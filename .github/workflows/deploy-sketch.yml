name: Build and deploy sketch portfolio

on:
  push:
    branches:
      - sketch-source
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-sketch
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: sketch-source
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build for /portfolio/sketch/
        working-directory: source
        run: npm run build -- --base=/portfolio/sketch/

      - name: Publish build to main/sketch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" out
          rsync -a --delete --exclude 'textures/*/backups/' source/dist/ out/sketch/
          cp out/sketch/index.html out/sketch/404.html
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sketch
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Rebuild sketch portfolio from sketch-source"
          git push origin main
